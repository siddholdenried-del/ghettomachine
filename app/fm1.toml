# BongTech GhettoMachine: build settings (fm1-base tools/build.py). Four tracks: the drums, then T2..T4 (PLAN.md).
name = "GHETTOMACHINE"         # the build's file names (lower case): build/ghettomachine.fwsc
id_prefix = "FM-1_8"           # package identity: dev builds FM-1_800 (three digits, as M-UPGRADE and the Unbricker read it)
usb_manufacturer = "BongTech"
usb_product = "GhettoMachine FM-1"   # (at most 31 characters; "FM-1" in it: fm1-base's tools find it by that)
o2 = ["dsp/drums.c", "dsp/drum909.c", "dsp/drum808.c", "dsp/drum606.c", "dsp/synth.c", "dsp/track_insert.c", "dsp/fx.c", "dsp/fxbus.c", "dsp/master.c", "dsp/mbus.c", "dsp/uimath.c"]   # the engines at -O2, each its own unit
gen = ["tools/gen_drum_samples.py {gen}/x0x_drum_samples.h",   # the 909 cymbals (mu-law) and the pot tables
       "tools/gen_engine_tables.py {gen}/fe_tables.h",          # Felucca-Engines' tables (the synth voice)
       "tools/gen_logo.py {gen}/logo.h",                        # the boot screen's logo (Sedgwick Ave Display, OFL)
       "tools/gen_mono.py {gen}/mono_font.h"]                   # the monospace faces (IBM Plex Mono, OFL)
words = "words.tsv"
ble = false                    # no radio: the firmware is GPL-3.0, so JieLi's binary Bluetooth libraries stay out
cpu2 = true                    # the second core renders half the synth voices
cpu2_fallback = true           # one core (8 voices) after a failure of it, instead of a restart
companion = true              # the project file (plat_file_*); the samples over USB later (tools/fm1_sample.py)
usb_audio_channels = 10        # USB audio in: the master on 1-2, then each track alone (the stems: drums 3-4, T2 5-6, T3 7-8, T4 9-10)
# the site and firmware.json
tagline = "a 4-track groovebox for the FM-1: a 909 / 808 / 606 drum track and three instrument tracks"
repo = "https://github.com/siddholdenried-del/ghettomachine"
licence = "GPL-3.0-only"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0); the synth voice from Felucca-Engines by Leo Kuroshita, Hügelton Instruments (MIT); the 909 and 808 engines from X0X by Charles Vestal (GPL-3.0), after 9W9 and 8W8 by athousanddetails; the synthesized 606 from briwil’s Cesari port of 6W6 by Charles Vestal (GPL-3.0), with MIT voices by Matthew Fecher / AudioKit Pro; the 909 cymbals from ER-99 by Matthew Cieplak (GPL-3.0); the reverb, delay and master from X0X (GPL-3.0), after 9W9; the logo in Sedgwick Ave Display by The Sedgwick Ave Project Authors (SIL OFL 1.1)."
author = ""
description = "A 909 / 808 / 606 drum track with per-pad editing and per-pattern mutes, and three instrument tracks (mono, poly or sampler)."
tags = ["drum-machine", "groovebox"]
install = ""
site = "https://ghettomachine.bongcult.com"
title = "BongTech GhettoMachine"
screenshot = ""
